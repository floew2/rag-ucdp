[project]
name = "rag-ucdp"
version = "0.1.0"
description = "Hybrid RAG + structured-query system over UCDP conflict event data, with geospatial visualization and source-bias surfacing."
readme = "README.md"
authors = [
    { name = "Fabian Löw" }
]
license = { text = "MIT" }
keywords = ["rag", "retrieval-augmented-generation", "ucdp", "conflict-data", "nlp"]

requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=2.2",
    # Current versions everywhere except Intel Macs: PyTorch stopped publishing
    # x86_64 macOS wheels after 2.2, so that platform keeps the last working stack.
    "torch>=2.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers>=4.53; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "sentence-transformers>=3.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.44,<4.45; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=3.0,<3.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "folium>=0.16",
    "streamlit>=1.30",
    "streamlit-folium>=0.20",
]

[project.scripts]
rag-ucdp = "rag_ucdp.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.8",
    "pandas-stubs",
    "types-pyyaml",
    "watchdog>=6.0.0",
    "jupytext>=1.19.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Newer releases ship no Intel macOS wheel (pulled in by jupyter).
constraint-dependencies = [
    "argon2-cffi-bindings<26; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# The lockfile must install on all of these.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ucdp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle errors and warnings
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # isort (import sorting)
    "B",        # bugbear (likely bugs)
    "UP",       # pyupgrade (use modern Python syntax)
    "SIM",      # simplify
    "D",        # pydocstyle (docstring checks)
]
ignore = [
    "D203",     # conflict with D211
    "D213",     # conflict with D212
    "D100",     # don't require module docstrings on every file
    "D104",     # don't require __init__.py docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]      # don't require docstrings in tests
"app/*" = ["D"]        # don't require docstrings in streamlit app
"src/rag_ucdp/router.py" = ["UP042"] # StrEnum not yet supported by pinned mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "rank_bm25.*",
    "ollama.*",
    "folium.*",
    "streamlit.*",
    "sentence_transformers.*",
    "snowballstemmer.*",
]
ignore_missing_imports = true
