[project]
name = "rag-ucdp"
version = "0.1.0"
description = "Hybrid RAG + structured-query system over UCDP conflict event data, with geospatial visualization and source-bias surfacing."
readme = "README.md"
authors = [
    { name = "Fabian Löw", email = "102547841+floew2@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = ["rag", "retrieval-augmented-generation", "ucdp", "conflict-data", "nlp"]

requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "pandas-stubs",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ucdp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle errors and warnings
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # isort (import sorting)
    "B",        # bugbear (likely bugs)
    "UP",       # pyupgrade (use modern Python syntax)
    "SIM",      # simplify
    "D",        # pydocstyle (docstring checks)
]
ignore = [
    "D203",     # conflict with D211
    "D213",     # conflict with D212
    "D100",     # don't require module docstrings on every file
    "D104",     # don't require __init__.py docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]      # don't require docstrings in tests
"app/*" = ["D"]        # don't require docstrings in streamlit app

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "rank_bm25.*",
    "ollama.*",
    "folium.*",
    "streamlit.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true
