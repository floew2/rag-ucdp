# Everything runs in Docker; nothing else needs to be installed.
#
#   docker compose up -d          # first start: downloads models, builds indexes
#   docker compose logs -f init   # follow the one-time setup
#   open http://localhost:8501
#
# The first start downloads the app and Ollama images, the embedding model
# (~1.3 GB) and the answer model (~4 GB), and builds the search indexes on
# CPU, which takes hours. Later starts skip all of that.
#
# Working on the code? Build the image from your checkout instead of pulling:
#
#   docker compose up -d --build
#
# Already running Ollama on this computer (e.g. for GPU speed on a Mac)? Use it
# instead of the container:
#
#   docker compose -f compose.yaml -f compose.host-ollama.yaml up -d

name: rag-ucdp

x-app: &app
  image: ghcr.io/floew2/rag-ucdp:0.1.0       # released image; set to the version you want
  build: .                                   # used by `docker compose build` and if the image cannot be pulled
  environment:
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  volumes:
    - ./data:/app/data                       # event table and indexes
    - ./config:/app/config:ro                # edit config.yaml, then restart
    - hf-cache:/home/app/.cache/huggingface  # embedding model, downloaded once

services:
  ollama:
    image: ollama/ollama:0.17.0
    volumes:
      - ollama:/root/.ollama                 # answer model, downloaded once
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  # One-time setup on each start; skips whatever is already done.
  init:
    <<: *app
    command: ["rag-ucdp", "prepare"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  hf-cache:
  ollama:
