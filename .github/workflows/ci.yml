name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        # The runner image ships large toolchains this job does not need.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /

      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.host-ollama.yaml config --quiet

      - name: Check that pinned images exist
        run: docker manifest inspect ollama/ollama:0.17.0 > /dev/null

      - name: Build image
        run: |
          set +e
          docker build --progress=plain -t rag-ucdp:ci . 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the end of the build log as an annotation.
            msg=$(tail -n 40 build.log | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=docker build failed::$msg"
          fi
          exit "$status"

      - name: Image size
        run: echo "::notice title=Image size::$(docker image ls rag-ucdp:ci --format '{{.Size}}')"

      - name: CLI and torch work in the container
        run: |
          docker run --rm rag-ucdp:ci rag-ucdp --help
          docker run --rm rag-ucdp:ci python -c "import torch, sentence_transformers; print('torch', torch.__version__)"
          if docker run --rm rag-ucdp:ci sh -c 'ls /app/.venv/lib/python3.12/site-packages | grep -q "^nvidia"'; then
            echo "::error::CUDA libraries found in the image"; exit 1
          fi

      - name: Web app starts and reports healthy
        run: |
          docker run -d --name app rag-ucdp:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs app
          exit 1
