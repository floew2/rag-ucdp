name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Check that pinned images exist
        run: docker manifest inspect ollama/ollama:0.17.0 > /dev/null

      - name: Build image
        run: docker build -t rag-ucdp:ci .

      - name: CLI runs in the container
        run: docker run --rm rag-ucdp:ci rag-ucdp --help

      - name: Web app starts and reports healthy
        run: |
          docker run -d --name app rag-ucdp:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs app
          exit 1
